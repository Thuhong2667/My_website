<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Layout Website</title>
<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }
    body {
        background-color: #FFFFFF;
        font-family: 'Be Vietnam Pro', sans-serif;
        color: #333333;
        display: flex;
        flex-direction: column;
        align-items: center;
        width: 100%;
        overflow-x: hidden;
    }
    .page-container {
        width: 100%;
        max-width: 1210px;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        gap: 30px;
        padding: 20px 0 0 0;
    }
    header {
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        align-items: center;
        padding: 1px 0;
        gap: 35px;
        width: 100%;
        padding-top: 22px;
    }
    header .logo {
        width: 200px;
        height: 60px;
        background-color: #E2E2E2;
        border-radius: 8px;
        display: flex;
        justify-content: center;
        align-items: center;
        font-weight: 700;
        font-size: 20px;
        color: #333333;
    }
    header .menu {
        width: 820px;
        height: 34px;
        background-color: #E2E2E2;
        border-radius: 8px;
        display: flex;
        justify-content: center;
        align-items: center;
        font-weight: 700;
        font-size: 20px;
        color: #333333;
    }
    header .button {
        width: 120px;
        height: 42px;
        background-color: #E2E2E2;
        border-radius: 8px;
        display: flex;
        justify-content: center;
        align-items: center;
        font-weight: 700;
        font-size: 20px;
        color: #333333;
    }
    .block1 {
        width: 100vw;
        position: relative;
        left: 50%;
        transform: translateX(-50%);
        background-color: #F1F1F1;
        padding: 80px 0;
        display: flex;
        justify-content: center;
        align-items: center;
        padding-top: 80px;
    }
    .block1-inner {
        width: 100%;
        max-width: 1210px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 40px;
    }
    .block1 .content {
        width: 585px;
        height: 267px;
        background-color: #E2E2E2;
        border-radius: 8px;
        display: flex;
        justify-content: center;
        align-items: center;
        font-weight: 700;
        font-size: 20px;
        color: #333333;
    }
    .block1 .img {
        width: 585px;
        height: 520px;
        background-color: #E2E2E2;
        border-radius: 8px;
        display: flex;
        justify-content: center;
align-items: center;        
        font-weight: 700;
        font-size: 20px;
        color: #333333;
    }
    .block2 {
        display: flex;
        flex-direction: column;
        gap: 20px;
    }
    .titlebackground {
        width: 100%;
        display: flex;
        justify-content: center;
    }
    .title {
        width: 600px;
        height: 80px;
        background-color: #E2E2E2;
        border-radius: 8px;
        display: flex;
        justify-content: center;
        align-items: center;
        margin-top: 40px;
        margin-bottom: 20px;
    }
    .title p {
        font-family: 'Lora', serif;
        font-weight: 700;
        font-size: 20px;
        color: #333333;
    }
    p {
        margin: 0;
        font-size: 20px;
        font-family: 'Be Vietnam Pro', sans-serif;
        font-weight: bold;
    }

    .block2 .container {
        display: grid;
        grid-template-columns: repeat(3, 380px);
        justify-content: center;
        gap: 30px;
    }
    .block2 .item {
        width: 380px;
        height: 420px;
        background-color: #E2E2E2;
        border-radius: 8px;
        display: flex;
        justify-content: center;
        align-items: center;
    }
    .block3 {
        height: 580px;
        width: 100vw;
        position: relative;
        left: 50%;
        transform: translateX(-50%);
        background-color: #F1F1F1;
        padding: 35px 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        border-radius: 8px;
        gap: 20px;
        margin-top: 40px;
    }
    .block3 .container {
        display: grid;
        grid-template-columns: repeat(5, 226px);
        justify-content: center;
        align-items: center;
        width: 100%;
        gap: 20px;
    }
    .block3 .item {
        width: 226px;
        height: 300px;
        background-color: #E2E2E2;
        border-radius: 8px;
        display: flex;
        justify-content: center;
        align-items: center;
        padding-top: 1px;
    }
    .block4 {
        display: flex;
        flex-direction: column;
        gap: 20px;
        width: 100%;
        margin-bottom: 45px;
        padding: 10px 0;
    }
    .block4 .container {
        display: grid;
        grid-template-columns: repeat(4, 280px);
        justify-content: center;
        gap: 30px;
        width: 100%;
    }
    .block4 .item {
        width: 100vw;
        position: relative;
        left: 50%;
        transform: translateX(-50%);
        width: 280px;
        height: 280px;
        background-color: rgb(226, 226, 226);
        border-radius: 8px;
        display: flex;
        justify-content: center;
        align-items: center;
    }
    footer {
        width: 100vw;
        position: relative;
        left: 50%;
        transform: translateX(-50%);
        height: 72px;
        background-color: rgb(226, 226, 226);
        display: flex;
        justify-content: center;
        align-items: center;
        border-radius: 8px;
        margin: 0 auto 0 auto;
    }

</style>
</head>
<body>
    <div class="page-container">
        <header>
            <div class="logo">Logo</div>
            <div class="menu"><p>Menu</p></div>
            <div class="button"><p>Button</p></div>
        </header>

        <div class="block1">
            <div class="block1-inner">
                <div class="content"><p>Content</p></div>
                <div class="img"><p>Image</p></div>
            </div>
        </div>

        <div class="block2">
            <div class="titlebackground">
                <div class="title"><p>Title</p></div>
            </div>
            <div class="container">
                <div class="item"><p>Item</p></div>
                <div class="item"><p>Item</p></div>
                <div class="item"><p>Item</p></div>
                <div class="item"><p>Item</p></div>
                <div class="item"><p>Item</p></div>
                <div class="item"><p>Item</p></div>
            </div>
        </div>

        <div class="block3">
            <div class="titlebackground">
                <div class="title"><p>Title</p></div>
            </div>
<div class="container">
                <div class="item"><p>Item</p></div>
                <div class="item"><p>Item</p></div>
                <div class="item"><p>Item</p></div>
                <div class="item"><p>Item</p></div>
                <div class="item"><p>Item</p></div>
            </div>
        </div>

        <div class="block4">
            <div class="titlebackground">
                <div class="title"><p>Title</p></div>
            </div>
            <div class="container">
                <div class="item"><p>Item</p></div>
                <div class="item"><p>Item</p></div>
                <div class="item"><p>Item</p></div>
                <div class="item"><p>Item</p></div>
            </div>
        </div>
            <footer><p>Footer</p></footer>
    </div>
</body>
</html>
